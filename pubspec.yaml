name: mon_go_search
description: A cross platform project aimed to bring more complex search options to Pokemon Go users

# Prevent accidental publishing to pub.dev (private package)
publish_to: 'none'

# Version format: {semantic}+{build_number}
# - Semantic (1.0.0): displayed to users, update manually for major/minor releases
# - Build number (+1): auto-incremented by CI/CD, used by Android/iOS for versioning
version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <3.0.0"

# Check for updates: flutter pub outdated
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  graphview: ^1.0.0
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Code quality rules - configured in analysis_options.yaml
  flutter_lints: ^1.0.0

flutter:
  # Enable Material Design icons
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
flutter_icons:
  android: "launcher_icon"
  image_path: "assets/mango512.png"
